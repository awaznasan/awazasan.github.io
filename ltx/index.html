<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LTX — The world model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --retake-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --retake-slow-ease: cubic-bezier(0.65, 0, 0.35, 1);
}

*, *::before, *::after { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background: #000;
  color: #fff;
  font-family: 'Manrope', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

button { font-family: 'Manrope', system-ui, sans-serif; color: inherit; }

h1, p { margin: 0; }

::selection { background: rgba(255, 255, 255, 0.2); }

:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* ── Stage + media ─────────────────────────────────────────── */

.stage {
  position: relative;
  isolation: isolate;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: #000;
}

.media {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  z-index: 0;
  pointer-events: none;
  visibility: hidden;
}

.media.is-visible { visibility: visible; }

/* ── Hero copy ─────────────────────────────────────────────── */

.hero {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

.title {
  position: absolute;
  top: 35.9%;
  left: 50%;
  transform: translateX(-50%);
  width: min(901px, calc(100vw - 48px));
  font-size: clamp(62px, 6.8vw, 100px);
  font-weight: 500;
  line-height: 0.8;
  letter-spacing: -0.04em;
  white-space: nowrap;
  text-align: center;
  text-shadow: 0 2px 12px rgb(0 0 0 / 0.14);
}

.title span {
  display: inline-block;
  transition:
    opacity 900ms var(--retake-ease),
    filter 900ms var(--retake-ease),
    transform 900ms var(--retake-ease);
}

.title span:nth-child(2) { transition-delay: 90ms; }
.title span:nth-child(3) { transition-delay: 180ms; }

.stage.title-hidden .title span {
  opacity: 0;
  filter: blur(12px);
  transform: translateY(-10px);
}

.lede {
  position: absolute;
  top: calc(46.78% + 94px);
  left: 50%;
  transform: translateX(-50%);
  width: min(734px, calc(100vw - 48px));
  font-size: clamp(14px, 1.25vw, 18px);
  font-weight: 400;
  line-height: 1.2;
  letter-spacing: -0.04em;
  text-align: center;
  text-shadow: 0 1px 8px rgb(0 0 0 / 0.16);
}

/* ── Controller ────────────────────────────────────────────── */

.controller {
  position: absolute;
  top: 46.78%;
  left: 50%;
  transform: translateX(-50%);
  width: min(880px, calc(100vw - 48px));
  height: 72px;
  z-index: 20;
}

.glass {
  position: absolute;
  border-radius: 999px;
}

.glass::before,
.glass::after {
  content: "";
  position: absolute;
  border-radius: inherit;
  pointer-events: none;
}

.glass::before {
  inset: 0;
  background:
    radial-gradient(120% 150% at var(--glass-x, 24%) var(--glass-y, 8%),
                    rgb(255 255 255 / 0.25), rgb(255 255 255 / 0) 53%),
    linear-gradient(115deg, rgb(255 255 255 / 0.10), rgb(255 255 255 / 0) 42%);
}

.glass::after {
  inset: -1px;
  padding: 1px;
  background: conic-gradient(from 225deg, #7fe3ff, rgb(255 255 255 / 0.35), #ffffff,
                             #ffd7e6, rgb(255 255 255 / 0.35), #7fe3ff);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
}

.track {
  top: 4px;
  left: 0;
  width: 100%;
  height: 64px;
  background: rgb(24 55 82 / 0.31);
  border: 1px solid rgb(255 255 255 / 0.2);
  -webkit-backdrop-filter: blur(9px) saturate(126%) contrast(108%) brightness(103%);
          backdrop-filter: blur(9px) saturate(126%) contrast(108%) brightness(103%);
  box-shadow:
    0 14px 38px rgb(4 24 43 / 0.16),
    0 2px 7px rgb(4 24 43 / 0.1),
    inset 1px 1px 0 rgb(255 255 255 / 0.48),
    inset -1px -1px 0 rgb(21 49 73 / 0.14),
    inset 0 0 0 0.5px rgb(255 255 255 / 0.16);
  transition:
    left 980ms var(--retake-slow-ease),
    width 980ms var(--retake-slow-ease),
    top 980ms var(--retake-slow-ease),
    height 980ms var(--retake-slow-ease),
    border-radius 980ms var(--retake-slow-ease),
    opacity 500ms linear;
}

.track::after { opacity: 0.27; }

.capsule {
  top: -1px;
  height: 72px;
  left: var(--cap-left, -5px);
  width: var(--cap-width, calc(20% + 5px));
  background-color: rgb(246 251 255 / 0.24);
  border: 1px solid rgb(255 255 255 / 0.28);
  -webkit-backdrop-filter: blur(13px) saturate(128%) contrast(107%) brightness(105%);
          backdrop-filter: blur(13px) saturate(128%) contrast(107%) brightness(105%);
  box-shadow:
    0 11px 28px rgb(4 24 43 / 0.17),
    0 2px 6px rgb(4 24 43 / 0.1),
    inset 1px 1px 0 rgb(255 255 255 / 0.62),
    inset -1px -1px 0 rgb(20 49 73 / 0.18),
    inset 0 0 12px rgb(255 255 255 / 0.055);
  transition:
    left 620ms var(--retake-ease),
    width 620ms var(--retake-ease),
    background-color 980ms var(--retake-slow-ease),
    opacity 420ms var(--retake-ease);
}

.capsule::after { opacity: 0.30; }

.cells {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  align-items: center;
}

.cell {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 0 14px;
  font-size: 23px;
  font-weight: 400;
  line-height: 1.2;
  letter-spacing: -0.04em;
  white-space: nowrap;
  transition:
    opacity 420ms var(--retake-ease),
    filter 420ms var(--retake-ease),
    transform 980ms var(--retake-slow-ease);
}

.cell--label {
  transition:
    opacity 300ms var(--retake-ease),
    filter 420ms var(--retake-ease),
    transform 980ms var(--retake-slow-ease);
}

.cell--btn {
  margin: 0;
  background: transparent;
  border: 0;
  border-radius: 999px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.cell--btn:disabled { cursor: default; }

.cell__text {
  display: inline-block;
  transition:
    opacity 420ms var(--retake-ease),
    filter 420ms var(--retake-ease);
}

.cell__text.is-reset {
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
  animation: reset-in 520ms var(--retake-ease) both;
}

.cell__text.is-leaving {
  opacity: 0;
  filter: blur(10px);
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
  transition-duration: 240ms;
}

@keyframes reset-in {
  from { opacity: 0; filter: blur(10px); }
  to   { opacity: 1; filter: blur(0); }
}

.controller.has-highlight .cell--label { opacity: 0.5; }

/* Collapse (forward + selected) */

.controller.collapsed .capsule,
.controller.reopening .capsule {
  transition:
    left 980ms var(--retake-slow-ease),
    width 980ms var(--retake-slow-ease),
    background-color 980ms var(--retake-slow-ease),
    opacity 420ms var(--retake-ease);
}

.controller.collapsed .capsule {
  left: calc(50% - 100px);
  width: 200px;
  background-color: rgb(246 251 255 / 0.14);
}

.controller.collapsed .track {
  left: calc(50% - 96px);
  width: 192px;
}

.controller.rear-fade .track {
  opacity: 0;
  transition:
    left 980ms var(--retake-slow-ease),
    width 980ms var(--retake-slow-ease),
    top 980ms var(--retake-slow-ease),
    height 980ms var(--retake-slow-ease),
    border-radius 980ms var(--retake-slow-ease),
    opacity 400ms linear 650ms;
}

.controller.collapsed .cell:not(.is-chosen) {
  opacity: 0;
  filter: blur(10px);
  transform: scale(0.94);
  pointer-events: none;
}

.cell.is-chosen { transform: translate(var(--tx, 0px), var(--ty, 0px)); }

.controller.reopening .cell:not(.is-chosen) {
  transition:
    opacity 760ms var(--retake-ease) 60ms,
    filter 760ms var(--retake-ease) 60ms,
    transform 980ms var(--retake-slow-ease);
}

/* ── Header ────────────────────────────────────────────────── */

.header {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 30;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  padding: calc(58px + env(safe-area-inset-top)) 40px 40px;
  text-shadow: 0 1px 6px rgb(0 0 0 / 0.18);
  pointer-events: none;
}

.header a { pointer-events: auto; }

.logo { display: inline-flex; align-items: center; color: #fff; }

.logo svg { display: block; height: 24px; width: auto; }

.meta {
  display: flex;
  align-items: center;
  margin-left: clamp(48px, 5vw, 70px);
  gap: clamp(28px, 3vw, 44px);
  font-size: 18px;
  line-height: 1.2;
  letter-spacing: -0.04em;
  white-space: nowrap;
}

.try {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 152px;
  height: 38px;
  border-radius: 999px;
  border: 1px solid rgb(255 255 255 / 0.75);
  background: transparent;
  color: #fff;
  font-size: 18px;
  letter-spacing: -0.04em;
  text-decoration: none;
  text-shadow: none;
  transition:
    color 300ms var(--retake-ease),
    background-color 300ms var(--retake-ease),
    border-color 300ms var(--retake-ease);
}

.try:hover,
.try:focus-visible {
  background-color: #fff;
  border-color: #fff;
  color: #0b1a26;
}

/* ── Notice ────────────────────────────────────────────────── */

.notice {
  position: absolute;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 8px 8px 8px 20px;
  border-radius: 999px;
  background: rgb(24 55 82 / 0.42);
  border: 1px solid rgb(255 255 255 / 0.24);
  -webkit-backdrop-filter: blur(12px) saturate(126%);
          backdrop-filter: blur(12px) saturate(126%);
  font-size: 14px;
  letter-spacing: -0.02em;
  white-space: nowrap;
}

.notice[hidden] { display: none; }

.notice button {
  height: 34px;
  padding: 0 16px;
  border-radius: 999px;
  border: 1px solid rgb(255 255 255 / 0.75);
  background: transparent;
  font-size: 14px;
  cursor: pointer;
  transition: background-color 300ms var(--retake-ease), color 300ms var(--retake-ease);
}

.notice button:hover,
.notice button:focus-visible { background: #fff; color: #0b1a26; }

/* ── Responsive ────────────────────────────────────────────── */

@media (max-width: 900px) {
  .header { padding: calc(24px + env(safe-area-inset-top)) 24px 24px; }
  .meta { font-size: 14px; gap: 22px; margin-left: 34px; }
  .try { width: 116px; height: 36px; font-size: 14px; }
  .cell { font-size: clamp(17px, 2.5vw, 24px); }
}

@media (max-width: 700px) {
  .header { padding-left: 18px; padding-right: 18px; }
  .logo svg { height: 21px; }
  .meta { font-size: 12px; }
  .meta span:nth-child(2) { display: none; }
  .try { width: 92px; height: 34px; font-size: 13px; }
  .try::after { content: ""; position: absolute; inset: -6px -10px; }

  .title {
    top: 34%;
    width: calc(100vw - 40px);
    font-size: clamp(48px, 14vw, 64px);
    line-height: 0.88;
    white-space: normal;
  }

  .lede { top: 77%; width: calc(100vw - 44px); font-size: 14px; }

  .controller { top: 53%; width: calc(100vw - 40px); height: 156px; }

  .track { top: 0; height: 156px; border-radius: 28px; }

  .controller.collapsed .track {
    left: calc(50% - 94px);
    width: 188px;
    top: calc(4vh - 30px);
    top: calc(4dvh - 30px);
    height: 60px;
    border-radius: 999px;
  }

  .cells {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 48px 54px 54px;
    align-items: stretch;
  }

  .cells::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(rgb(255 255 255 / 0.12), rgb(255 255 255 / 0.12)) 0 48px / 100% 1px no-repeat,
      linear-gradient(rgb(255 255 255 / 0.12), rgb(255 255 255 / 0.12)) 0 102px / 100% 1px no-repeat,
      linear-gradient(rgb(255 255 255 / 0.12), rgb(255 255 255 / 0.12)) 50% 48px / 1px 108px no-repeat;
    transition: opacity 420ms var(--retake-ease);
  }

  .controller.collapsed .cells::before { opacity: 0; }
  .controller.reopening .cells::before { transition: opacity 760ms var(--retake-ease) 60ms; }

  .cell { font-size: 17px; padding: 0 10px; border-radius: 20px; }
  .cell--label { grid-column: 1 / -1; }

  .cell--btn:active { background: rgb(255 255 255 / 0.08); }
  .cell--btn:focus-visible { outline-offset: -3px; }

  /* No sliding hover capsule on phones; it only appears as the selected surface. */
  .capsule {
    opacity: 0;
    pointer-events: none;
    transition:
      opacity 420ms var(--retake-ease),
      background-color 980ms var(--retake-slow-ease);
  }

  .controller.collapsed .capsule,
  .controller.reopening .capsule {
    left: 50%;
    top: 4vh;
    top: 4dvh;
    width: 196px;
    height: 64px;
    transform: translate(-50%, -50%);
    border-radius: 999px;
    background-color: rgb(246 251 255 / 0.18);
    transition:
      opacity 420ms var(--retake-ease),
      background-color 980ms var(--retake-slow-ease);
  }

  .controller.collapsed .capsule { opacity: 1; }

  .controller.has-highlight .cell--label { opacity: 1; }
}

@media (max-width: 700px) and (max-height: 700px) {
  .controller { top: 50%; }
  .lede { top: calc(50% + 168px); width: calc(100vw - 32px); font-size: 13px; }
}

@media (max-height: 520px) and (orientation: landscape) {
  .header { padding-top: calc(20px + env(safe-area-inset-top)); padding-bottom: 20px; }
  .title { top: 20%; font-size: clamp(34px, 8vh, 56px); }
  .controller { top: 50%; }
  .lede { top: auto; bottom: 8px; font-size: 13px; }
}

@media (max-width: 700px) and (max-height: 520px) and (orientation: landscape) {
  .title { top: 12%; font-size: clamp(28px, 7vh, 44px); }
  .controller { top: 46%; height: 118px; }
  .track { height: 118px; }
  .cells { grid-template-rows: 36px 41px 41px; }
  .cells::before {
    background:
      linear-gradient(rgb(255 255 255 / 0.12), rgb(255 255 255 / 0.12)) 0 36px / 100% 1px no-repeat,
      linear-gradient(rgb(255 255 255 / 0.12), rgb(255 255 255 / 0.12)) 0 77px / 100% 1px no-repeat,
      linear-gradient(rgb(255 255 255 / 0.12), rgb(255 255 255 / 0.12)) 50% 36px / 1px 82px no-repeat;
  }
  .cell { font-size: 15px; }
  .lede { bottom: 6px; font-size: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  .capsule,
  .track,
  .cell,
  .cell__text,
  .cells::before,
  .title span,
  .try {
    transition-duration: 1ms !important;
    transition-delay: 0s !important;
  }
  .cell__text.is-reset { animation-duration: 1ms; }
  .controller.collapsed .cell:not(.is-chosen),
  .stage.title-hidden .title span,
  .cell__text.is-leaving { filter: none; }
  .cell__text.is-reset { animation-name: none; }
}
</style>
</head>
<body>

  <video class="media" id="v-colorway" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-1.mp4" muted playsinline preload="auto" aria-hidden="true"></video>

</main>

<script>
(function () {
  'use strict';

  var FIRST_FRAME_TIMEOUT = 12000;
  var STALL_TIMEOUT = 8000;
  var DEFAULT_HOLD = 0.08;
  var BASE_ID = 'v-colorway';
  var STALE = { stale: true };

  var CLIPS = {
    scene:    { label: 'Scene',    fwd: 'v-scene',    rev: 'v-scene-rev',    fwdHold: DEFAULT_HOLD, revHold: 0.18,         fwdDur: 2.08, revDur: 2.08 },
    light:    { label: 'Lighting', fwd: 'v-light',    rev: 'v-light-rev',    fwdHold: DEFAULT_HOLD, revHold: DEFAULT_HOLD, fwdDur: 2.08, revDur: 2.04 },
    colorway: { label: 'Clothing', fwd: 'v-colorway', rev: 'v-colorway-rev', fwdHold: DEFAULT_HOLD, revHold: DEFAULT_HOLD, fwdDur: 2.08, revDur: 2.08 },
    fullLook: { label: 'Cast',     fwd: 'v-fulllook', rev: 'v-fulllook-rev', fwdHold: DEFAULT_HOLD, revHold: DEFAULT_HOLD, fwdDur: 3.00, revDur: 2.48 }
  };

  var CAP_POS = [
    ['-5px', 'calc(20% + 5px)'],
    ['20%', '20%'],
    ['40%', '20%'],
    ['60%', '20%'],
    ['80%', 'calc(20% + 5px)']
  ];

  var stage = document.getElementById('stage');
  var controller = document.getElementById('controller');
  var live = document.getElementById('live');
  var notice = document.getElementById('notice');
  var noticeText = document.getElementById('notice-text');
  var retryBtn = document.getElementById('retry');
  var buttons = Array.prototype.slice.call(controller.querySelectorAll('.cell--btn'));
  var labelCell = controller.querySelector('.cell--label');
  var videos = {};
  Array.prototype.slice.call(stage.querySelectorAll('video.media')).forEach(function (v) {
    videos[v.id] = v;
  });

  var mobileQuery = window.matchMedia ? window.matchMedia('(max-width: 700px)') : null;

  var state = {
    scene: 'base',          // base | scene | light | colorway | fullLook
    playback: 'loading',    // loading | ready | starting | playing | error
    direction: null,        // forward | reverse
    locked: false,
    token: 0,
    selected: null,
    visible: null,
    ready: {},
    failed: {},
    hoverIndex: 0,
    focusIndex: 0,
    pending: null,
    monitor: null,
    retry: null,
    labelTimer: null,
    reopenTimer: null
  };

  /* ── Helpers ─────────────────────────────────────────────── */

  function announce(msg) { live.textContent = msg; }

  function buttonFor(key) {
    for (var i = 0; i < buttons.length; i++) {
      if (buttons[i].getAttribute('data-key') === key) return buttons[i];
    }
    return null;
  }

  function textOf(btn) { return btn.querySelector('.cell__text'); }

  function isMobile() { return !!(mobileQuery && mobileQuery.matches); }

  function focusQuietly(el) {
    try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
  }

  function isFocusVisible(el) {
    try { return el.matches(':focus-visible'); } catch (e) { return true; }
  }

  function setVisible(v) {
    if (state.visible === v) return;
    var prev = state.visible;
    v.classList.add('is-visible');
    if (prev) prev.classList.remove('is-visible');
    state.visible = v;
  }

  function hideTitle() { stage.classList.add('title-hidden'); }
  function showTitle() { stage.classList.remove('title-hidden'); }

  function showNotice(msg, retry) {
    state.retry = retry;
    noticeText.textContent = msg;
    notice.hidden = false;
  }

  function hideNotice() {
    state.retry = null;
    notice.hidden = true;
  }

  /* ── Capsule + controller semantics ──────────────────────── */

  function renderCapsule() {
    if (state.locked || state.scene !== 'base') return;
    var idx = state.hoverIndex || state.focusIndex || 0;
    controller.style.setProperty('--cap-left', CAP_POS[idx][0]);
    controller.style.setProperty('--cap-width', CAP_POS[idx][1]);
    controller.classList.toggle('has-highlight', idx > 0);
  }

  function updateControls() {
    buttons.forEach(function (btn) {
      var key = btn.getAttribute('data-key');
      var clip = CLIPS[key];
      var pairReady = !!(state.ready[clip.fwd] && state.ready[clip.rev]);
      var chosen = state.selected === key;
      var enabled;
      var concealed;

      if (state.locked) {
        enabled = false;
        concealed = !chosen;
      } else if (state.scene === 'base') {
        enabled = pairReady && !!state.visible;
        concealed = false;
      } else {
        enabled = chosen;
        concealed = !chosen;
      }

      btn.disabled = !enabled;
      if (concealed) {
        btn.setAttribute('aria-hidden', 'true');
        btn.setAttribute('tabindex', '-1');
      } else {
        btn.removeAttribute('aria-hidden');
        btn.removeAttribute('tabindex');
      }
    });
    if (state.locked || state.scene !== 'base') {
      labelCell.setAttribute('aria-hidden', 'true');
    } else {
      labelCell.removeAttribute('aria-hidden');
    }
  }

  function chosenDelta(btn) {
    var cRect = controller.getBoundingClientRect();
    var bRect = btn.getBoundingClientRect();
    var tx = 0;
    var ty = 0;
    var m = window.getComputedStyle(btn).transform;
    if (m && m !== 'none') {
      var parts = m.replace(/^matrix(3d)?\(|\)$/g, '').split(',');
      if (parts.length === 6) { tx = parseFloat(parts[4]); ty = parseFloat(parts[5]); }
      else if (parts.length === 16) { tx = parseFloat(parts[12]); ty = parseFloat(parts[13]); }
    }
    var cx = bRect.left + bRect.width / 2 - tx;
    var cy = bRect.top + bRect.height / 2 - ty;
    var targetX = cRect.left + cRect.width / 2;
    var targetY = isMobile() ? cRect.top + stage.clientHeight * 0.04 : cRect.top - 1 + 36;
    return { x: targetX - cx, y: targetY - cy };
  }

  function collapse(btn) {
    clearTimeout(state.reopenTimer);
    var d = chosenDelta(btn);
    btn.style.setProperty('--tx', d.x + 'px');
    btn.style.setProperty('--ty', d.y + 'px');
    btn.classList.add('is-chosen');
    controller.classList.remove('reopening');
    controller.classList.remove('has-highlight');
    // Same style recalc: the CSS 650ms delay holds the rear fade until the collapse lands.
    controller.classList.add('collapsed');
    controller.classList.add('rear-fade');
  }

  function reopen(btn) {
    clearTimeout(state.reopenTimer);
    controller.classList.add('reopening');
    controller.classList.remove('collapsed');
    controller.classList.remove('rear-fade');
    btn.classList.remove('is-chosen');
    controller.style.setProperty('--cap-left', CAP_POS[0][0]);
    controller.style.setProperty('--cap-width', CAP_POS[0][1]);
    state.reopenTimer = setTimeout(function () {
      if (!controller.classList.contains('collapsed')) controller.classList.remove('reopening');
    }, 1100);
  }

  function setResetLabel(btn) {
    clearTimeout(state.labelTimer);
    var t = textOf(btn);
    t.classList.remove('is-leaving');
    t.textContent = 'Reset';
    t.classList.remove('is-reset');
    void t.offsetWidth;
    t.classList.add('is-reset');
  }

  function restoreLabel(btn, key, delay) {
    clearTimeout(state.labelTimer);
    var t = textOf(btn);
    t.classList.remove('is-reset');
    t.classList.add('is-leaving');
    state.labelTimer = setTimeout(function () {
      t.textContent = CLIPS[key].label;
      t.classList.remove('is-leaving');
    }, delay);
  }

  /* ── Seam-safe player ────────────────────────────────────── */

  function rewind(v, token) {
    return new Promise(function (resolve, reject) {
      var timer = null;
      function cleanup() {
        clearTimeout(timer);
        v.removeEventListener('seeked', onSeeked);
        v.removeEventListener('loadeddata', onLoaded);
        v.removeEventListener('error', onError);
      }
      function onSeeked() { cleanup(); token === state.token ? resolve() : reject(STALE); }
      function onError() { cleanup(); reject(new Error('Media error while seeking')); }
      function seek() {
        if (v.currentTime <= 0.001) { cleanup(); resolve(); return; }
        v.addEventListener('seeked', onSeeked);
        v.currentTime = 0;
      }
      function onLoaded() { v.removeEventListener('loadeddata', onLoaded); seek(); }

      v.pause();
      v.addEventListener('error', onError);
      timer = setTimeout(function () { cleanup(); reject(new Error('Seek timed out')); }, FIRST_FRAME_TIMEOUT);
      if (v.readyState >= 2) seek();
      else v.addEventListener('loadeddata', onLoaded);
    });
  }

  // Resolves once a decoded frame from THIS play request is ready to show.
  function startPlayback(v, token) {
    var p = {
      done: false,
      suspended: false,
      timer: null,
      rvfcId: null,
      rafIds: [],
      playGen: 0,
      settledFrame: false
    };
    state.pending = p;

    var playGate = new Promise(function (res, rej) { p.playRes = res; p.playRej = rej; });
    var frameGate = new Promise(function (res, rej) { p.frameRes = res; p.frameRej = rej; });

    function cleanup() {
      if (p.done) return;
      p.done = true;
      clearTimeout(p.timer);
      if (p.rvfcId !== null && v.cancelVideoFrameCallback) v.cancelVideoFrameCallback(p.rvfcId);
      p.rafIds.forEach(function (id) { cancelAnimationFrame(id); });
      v.removeEventListener('playing', onPlaying);
      v.removeEventListener('timeupdate', onPlaying);
      v.removeEventListener('error', onError);
      if (state.pending === p) state.pending = null;
    }

    function fail(err) {
      if (p.done) return;
      cleanup();
      p.frameRej(err);
      p.playRej(err);
    }

    function startTimer() {
      clearTimeout(p.timer);
      if (document.hidden) return;
      p.timer = setTimeout(function () {
        // A timeout is never treated as a decoded frame.
        fail(new Error('First frame timed out'));
      }, FIRST_FRAME_TIMEOUT);
    }

    function doPlay() {
      var gen = ++p.playGen;
      var pr;
      try { pr = v.play(); } catch (e) { fail(e); return; }
      if (pr && typeof pr.then === 'function') {
        pr.then(function () {
          if (gen === p.playGen) p.playRes();
        }, function (err) {
          // Our own visibility pause aborts play(); a newer request supersedes it.
          if (p.done || p.suspended || gen !== p.playGen) return;
          fail(err);
        });
      } else {
        p.playRes();
      }
    }

    function frameReady() {
      if (p.done || p.settledFrame) return;
      p.settledFrame = true;
      p.frameRes();
    }

    function onRVFC(now, meta) {
      p.rvfcId = null;
      if (p.done) return;
      if (token !== state.token) { fail(STALE); return; }
      // A stale endpoint frame carries a large mediaTime; keep waiting for this request's frame.
      if (meta.mediaTime <= 0.5 && v.readyState >= 2) frameReady();
      else p.rvfcId = v.requestVideoFrameCallback(onRVFC);
    }

    function onPlaying() {
      if (p.done || p.settledFrame || p.waitingTicks) return;
      if (v.readyState >= 2 && !v.paused && v.currentTime <= 0.5) {
        p.waitingTicks = true;
        p.rafIds.push(requestAnimationFrame(function () {
          p.rafIds.push(requestAnimationFrame(function () {
            p.waitingTicks = false;
            if (token !== state.token) { fail(STALE); return; }
            if (v.readyState >= 2 && v.currentTime <= 0.5) frameReady();
          }));
        }));
      }
    }

    function onError() { fail(new Error('Media error')); }

    p.suspend = function () {
      if (p.done) return;
      p.suspended = true;
      clearTimeout(p.timer);
      v.pause();
      if (v.currentTime > 0.001) v.currentTime = 0;
    };

    p.resume = function () {
      if (p.done) return;
      p.suspended = false;
      startTimer();
      doPlay();
    };

    p.cancel = cleanup;

    // Register the frame watcher before play().
    if (typeof v.requestVideoFrameCallback === 'function') {
      p.rvfcId = v.requestVideoFrameCallback(onRVFC);
    } else {
      v.addEventListener('playing', onPlaying);
      v.addEventListener('timeupdate', onPlaying);
    }
    v.addEventListener('error', onError);
    startTimer();
    if (document.hidden) p.suspended = true;
    else doPlay();

    return Promise.all([playGate, frameGate]).then(function () {
      cleanup();
      if (token !== state.token) throw STALE;
    }, function (err) {
      cleanup();
      v.pause();
      throw err;
    });
  }

  // Watches only the active clip and pauses it on its terminal hold frame.
  function holdAtEnd(v, hold, nominal, token, onTick) {
    return new Promise(function (resolve, reject) {
      var m = {
        done: false,
        suspended: false,
        rvfcId: null,
        rafId: null,
        watchdog: null,
        lastT: -1,
        lastProgress: Date.now()
      };
      state.monitor = m;

      var dur = isFinite(v.duration) && v.duration > 0 ? v.duration : nominal;
      var holdAt = Math.max(0, dur - hold);

      function cleanup() {
        if (m.done) return;
        m.done = true;
        if (m.rvfcId !== null && v.cancelVideoFrameCallback) v.cancelVideoFrameCallback(m.rvfcId);
        if (m.rafId !== null) cancelAnimationFrame(m.rafId);
        clearInterval(m.watchdog);
        v.removeEventListener('ended', onEnded);
        v.removeEventListener('error', onError);
        if (state.monitor === m) state.monitor = null;
      }

      function finish() {
        if (m.done) return;
        v.pause();
        cleanup();
        resolve();
      }

      function fail(err) {
        if (m.done) return;
        v.pause();
        cleanup();
        reject(err);
      }

      function check(t) {
        if (token !== state.token) { fail(STALE); return true; }
        if (onTick) onTick(t, dur);
        if (t >= holdAt) { finish(); return true; }
        return false;
      }

      function onFrame(now, meta) {
        m.rvfcId = null;
        if (m.done) return;
        if (!check(meta.mediaTime)) m.rvfcId = v.requestVideoFrameCallback(onFrame);
      }

      function onRaf() {
        m.rafId = null;
        if (m.done) return;
        if (!check(v.currentTime)) m.rafId = requestAnimationFrame(onRaf);
      }

      function onEnded() { finish(); }
      function onError() { fail(new Error('Media error during playback')); }

      m.suspend = function () {
        if (m.done) return;
        m.suspended = true;
        v.pause();
      };

      m.resume = function () {
        if (m.done) return;
        m.suspended = false;
        m.lastProgress = Date.now();
        var pr = v.play();
        if (pr && typeof pr.then === 'function') {
          pr.then(null, function (err) { if (!m.done && !m.suspended) fail(err); });
        }
      };

      v.addEventListener('ended', onEnded);
      v.addEventListener('error', onError);

      m.watchdog = setInterval(function () {
        if (m.done) return;
        if (document.hidden || m.suspended) { m.lastProgress = Date.now(); return; }
        if (v.currentTime !== m.lastT) {
          m.lastT = v.currentTime;
          m.lastProgress = Date.now();
        } else if (Date.now() - m.lastProgress > STALL_TIMEOUT) {
          fail(new Error('Playback stalled'));
        }
      }, 500);

      if (check(v.currentTime)) return;
      if (typeof v.requestVideoFrameCallback === 'function') m.rvfcId = v.requestVideoFrameCallback(onFrame);
      else m.rafId = requestAnimationFrame(onRaf);
    });
  }

  function runClip(id, hold, nominal, token, onTick) {
    var v = videos[id];
    return rewind(v, token)
      .then(function () {
        if (token !== state.token) throw STALE;
        state.playback = 'starting';
        return startPlayback(v, token);
      })
      .then(function () {
        if (token !== state.token) throw STALE;
        setVisible(v); // atomic swap, never a crossfade
        state.playback = 'playing';
        return holdAtEnd(v, hold, nominal, token, onTick);
      });
  }

  /* ── Transitions ─────────────────────────────────────────── */

  function startForward(key) {
    var btn = buttonFor(key);
    var clip = CLIPS[key];
    if (state.locked || state.scene !== 'base') return;
    if (!(state.ready[clip.fwd] && state.ready[clip.rev]) || !state.visible) return;

    // Synchronous lock: capture focus, then disable everything in the same tick.
    var hadFocus = document.activeElement === btn;
    var token = ++state.token;
    state.locked = true;
    state.direction = 'forward';
    state.selected = key;
    state.playback = 'starting';
    hideNotice();
    updateControls();
    collapse(btn);
    announce('Changing ' + clip.label.toLowerCase() + '…');

    var titleHidden = false;
    runClip(clip.fwd, clip.fwdHold, clip.fwdDur, token, function (t, dur) {
      if (!titleHidden && t >= Math.min(dur * 0.12, 0.9)) {
        titleHidden = true;
        hideTitle();
      }
    }).then(function () {
      if (token !== state.token) return;
      state.locked = false;
      state.direction = null;
      state.scene = key;
      state.playback = 'ready';
      hideTitle();
      setResetLabel(btn);
      updateControls();
      if (hadFocus) focusQuietly(btn);
      announce(clip.label + ' applied. Press Reset to return to the base scene.');
    }, function (err) {
      if (err === STALE || token !== state.token) return;
      state.locked = false;
      state.direction = null;
      state.scene = 'base';
      state.selected = null;
      state.playback = 'error';
      reopen(btn);
      showTitle();
      updateControls();
      renderCapsule();
      if (hadFocus) focusQuietly(btn);
      announce('The ' + clip.label.toLowerCase() + ' transition could not play. Retry is available.');
      showNotice('Couldn’t play the ' + clip.label.toLowerCase() + ' transition.', function () { startForward(key); });
    });
  }

  function startReverse(key) {
    var btn = buttonFor(key);
    var clip = CLIPS[key];
    if (state.locked || state.scene !== key) return;

    var hadFocus = document.activeElement === btn;
    var token = ++state.token;
    state.locked = true;
    state.direction = 'reverse';
    state.playback = 'starting';
    hideNotice();
    updateControls();
    announce('Returning to the base scene…');

    // Reverse clip and bar expansion run in parallel.
    restoreLabel(btn, key, 260);
    reopen(btn);

    runClip(clip.rev, clip.revHold, clip.revDur, token, null).then(function () {
      if (token !== state.token) return;
      state.locked = false;
      state.direction = null;
      state.scene = 'base';
      state.selected = null;
      state.playback = 'ready';
      showTitle();
      updateControls();
      renderCapsule();
      if (hadFocus) focusQuietly(btn);
      announce('Back to the base scene.');
    }, function (err) {
      if (err === STALE || token !== state.token) return;
      state.locked = false;
      state.direction = null;
      state.scene = key;
      state.playback = 'error';
      collapse(btn);
      setResetLabel(btn);
      updateControls();
      if (hadFocus) focusQuietly(btn);
      announce('Could not return to the base scene. Retry is available.');
      showNotice('Couldn’t return to the base scene.', function () { startReverse(key); });
    });
  }

  /* ── Media readiness ─────────────────────────────────────── */

  function showBase() {
    var base = videos[BASE_ID];
    if (state.visible || !state.ready[BASE_ID]) return;
    base.pause();
    setVisible(base);
    state.playback = 'ready';
    hideNotice();
    announce('Scene loaded. Select a state.');
  }

  function markReady(v) {
    if (state.ready[v.id]) return;
    state.ready[v.id] = true;
    state.failed[v.id] = false;
    if (v.id === BASE_ID) showBase();
    updateControls();
  }

  function retryLoading() {
    hideNotice();
    Object.keys(videos).forEach(function (id) {
      if (state.failed[id]) {
        state.failed[id] = false;
        videos[id].load();
      }
    });
    announce('Loading scenes…');
  }

  function onMediaError(v) {
    if (state.ready[v.id] && state.visible) return; // handled by the transition that hit it
    state.failed[v.id] = true;
    if (state.locked) return;
    if (v.id === BASE_ID && !state.visible) state.playback = 'error';
    announce('Some scenes failed to load. Retry is available.');
    showNotice('Some scenes failed to load.', retryLoading);
  }

  Object.keys(videos).forEach(function (id) {
    var v = videos[id];
    function check() { if (v.readyState >= 2) markReady(v); }
    v.addEventListener('loadeddata', check);
    v.addEventListener('canplay', check);
    v.addEventListener('error', function () { onMediaError(v); });
    check(); // cached media may never fire loadeddata again
  });

  /* ── Input ───────────────────────────────────────────────── */

  buttons.forEach(function (btn) {
    var key = btn.getAttribute('data-key');
    var idx = parseInt(btn.getAttribute('data-index'), 10);

    btn.addEventListener('click', function () {
      if (state.locked) return;
      if (state.scene === 'base') startForward(key);
      else if (state.scene === key) startReverse(key);
      // Branch-to-branch is not a valid flow: ignore.
    });

    btn.addEventListener('mouseenter', function () {
      state.hoverIndex = idx;
      renderCapsule();
    });

    btn.addEventListener('focus', function () {
      state.focusIndex = isFocusVisible(btn) ? idx : 0;
      renderCapsule();
    });

    btn.addEventListener('blur', function () {
      state.focusIndex = 0;
      renderCapsule();
    });
  });

  labelCell.addEventListener('mouseenter', function () {
    state.hoverIndex = 0;
    renderCapsule();
  });

  controller.addEventListener('mouseleave', function () {
    state.hoverIndex = 0;
    renderCapsule();
  });

  var glassRect = null;
  var glassFrame = null;
  var glassPoint = null;
  controller.addEventListener('pointerenter', function () { glassRect = controller.getBoundingClientRect(); });
  controller.addEventListener('pointermove', function (e) {
    glassPoint = e;
    if (glassFrame !== null) return;
    glassFrame = requestAnimationFrame(function () {
      glassFrame = null;
      if (!glassRect || !glassPoint) return;
      var x = ((glassPoint.clientX - glassRect.left) / glassRect.width) * 100;
      var y = ((glassPoint.clientY - glassRect.top) / glassRect.height) * 100;
      controller.style.setProperty('--glass-x', x.toFixed(1) + '%');
      controller.style.setProperty('--glass-y', y.toFixed(1) + '%');
    });
  });

  retryBtn.addEventListener('click', function () {
    var fn = state.retry;
    hideNotice();
    if (fn) fn();
  });

  document.addEventListener('visibilitychange', function () {
    var p = state.pending;
    var m = state.monitor;
    if (document.hidden) {
      if (p) p.suspend();
      if (m) m.suspend();
    } else {
      if (p) p.resume();
      if (m) m.resume();
    }
  });

  // Keep the travelled label centred on the capsule through resizes.
  var resizeFrame = null;
  window.addEventListener('resize', function () {
    if (resizeFrame !== null) return;
    resizeFrame = requestAnimationFrame(function () {
      resizeFrame = null;
      glassRect = null;
      if (!state.selected || !controller.classList.contains('collapsed')) return;
      var btn = buttonFor(state.selected);
      var d = chosenDelta(btn);
      btn.style.setProperty('--tx', d.x + 'px');
      btn.style.setProperty('--ty', d.y + 'px');
    });
  });

  announce('Loading scenes…');
  updateControls();
})();
</script>
</body>
</html>
