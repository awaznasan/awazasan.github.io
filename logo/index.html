<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hem &amp; Hälsa – logotyp</title>
<link rel="icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,400&family=DM+Sans&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'DM Sans',sans-serif;background:#F4EFE6;color:#2E4A38}
  main{max-width:900px;margin:0 auto;padding:48px 16px;display:grid;gap:24px}
  .card{border-radius:20px;padding:40px;display:grid;place-items:center}
  .light{background:#fff}.dark{background:#2E4A38}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:24px}
  img{max-width:100%}
  .swatches{display:flex;gap:12px;flex-wrap:wrap}
  .sw{width:110px;height:70px;border-radius:12px;display:flex;align-items:flex-end;padding:8px;font-size:12px;box-sizing:border-box}
</style>
</head>
<body>
<main>
  <h1 style="font-family:Fraunces,serif;margin:0">Hem &amp; Hälsa – logotyp</h1>
  <div class="card light"><img src="logo.svg" width="520" alt="Hem & Hälsa logotyp"></div>
  <div class="card dark"><img src="logo-ljus.svg" width="520" alt="Hem & Hälsa logotyp, ljus variant"></div>
  <div class="row">
    <div class="card light"><img src="icon.svg" width="120" alt="Ikon"></div>
    <div class="card light"><img src="icon.svg" width="48" alt="Ikon liten"></div>
    <div class="card dark"><img src="icon.svg" width="120" alt="Ikon på mörk bakgrund" style="background:#F4EFE6;border-radius:24px;padding:10px"></div>
  </div>
  <div class="swatches">
    <div class="sw" style="background:#3F6B4E;color:#fff">#3F6B4E</div>
    <div class="sw" style="background:#7FA66B;color:#fff">#7FA66B</div>
    <div class="sw" style="background:#D9785B;color:#fff">#D9785B</div>
    <div class="sw" style="background:#2E4A38;color:#fff">#2E4A38</div>
    <div class="sw" style="background:#F4EFE6;border:1px solid #ccc">#F4EFE6</div>
  </div>
</main>
</body>
</html>
